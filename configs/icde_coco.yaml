# COCO Karpathy val/test; all captions retained, no adapter training.
bits: 128
seeds: [0, 1, 42]
batch_sizes: [1, 32]
candidate_budgets: [50, 100, 200, 500, 1000, 2000, 5000]
candidate_budget_fractions: [0.1, 0.25, 0.5, 0.75, 1.0]
ivf_nlist: [32, 64, 128, 256, 512, 640]
ivf_nprobe: [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512, 640]
ivf_seed: 42
# Full validation sweep, then test only its selected IVF operating points.
test_selected_ivf: true
quality_targets: [0.95, 0.99]
threads: 1
cpus: [0, 2, 4, 6, 8, 10, 12, 14]
blas_core: Haswell
warmup: 5
repeats: 3
timing_queries: 256
expected_images: {val: 5000, test: 5000}
# The original annotations contain ten six-caption images per split (25,010 texts).
captions_per_image: null
cache_quality_scores: true
quality_audit_queries: 64
