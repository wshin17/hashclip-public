# HashCLIP default configuration.
# Every field is read by hashclip.cli; override on the command line, e.g.
#   python -m hashclip.cli train --bits 64 --seed 0

project:
  name: hashclip
  method: HashCLIP

paths:
  data_raw: data/raw/flickr30k
  data_processed: data/processed
  features: outputs/features
  checkpoints: outputs/checkpoints
  logs: outputs/logs
  tables: outputs/tables
  plots: outputs/plots

dataset:
  source: nlphuji/flickr30k
  expected_counts:
    train: 29000
    val: 1014
    test: 1000

backbone:
  hf_hub: "hf-hub:timm/ViT-B-16-SigLIP"
  embed_dim: 768

model:
  bits: 128                  # main run: B = 128
  hidden_dim: 512
  init_logit_scale: 2.6593   # ln(1/0.07)
  max_logit_scale: 4.6052    # ln(100)

loss:
  lambda_q: 0.1
  lambda_b: 0.01

train:
  batch_size: 128
  optimizer: adamw
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 200
  cosine_min_lr: 1.0e-6
  epochs: 15
  precision: bf16            # bf16 on Ampere+; auto-falls back to fp32 on older GPUs (e.g. V100)
  grad_clip: 1.0
  seed: 42
  num_workers_windows: 0     # Windows uses 'spawn' — keep at 0 for safety
  num_workers_linux: 4
  log_every: 50              # train steps between log lines
  use_cached_features: true  # train on pre-extracted backbone features

eval:
  M: 1000                    # main re-rank pool size
  topk: [1, 5, 10]
  warmup_queries: 5

ablation:
  bits: [32, 64, 128, 256]
  M: [50, 100, 200, 500, 1000, 2000, 5000]
  loss_variants: ["nce_only", "nce_quant", "nce_balance", "full"]
  adapter_hidden: [0, 256, 512, 1024]
  seeds: [42, 0, 1]
